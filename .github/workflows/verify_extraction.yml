name: Test backend verification

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  tests:
    name: nix-action
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space by removing preinstalled packages
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: cachix/cachix-action@v15
      with:
        name: hax
        skipPush: true
        extraPullNames: fstar-nix-versions, z3-nix-versions

    - name: Install the toolchain
      run: |
        nix profile install nixpkgs#yq
        nix profile install .#rustc
        nix profile install .

    - name: Verify F* tests
      run: |
        nix develop .#ci-examples --command just test -b fstar -j 1

    - name: Verify Lean tests
      run: |
        nix develop .#ci-examples --command bash -c \
          "elan default \$(cat hax-lib/proof-libs/lean/lean-toolchain) && lake build --dir hax-lib/proof-libs/lean && just test -b lean"

    - name: Try to extract Rust By Examples
      run: |
        nix build .#rust-by-example-hax-extraction -L

  discover-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
    - uses: actions/checkout@v4
    - name: List examples from Makefile
      id: list
      run: |
        examples=$(grep -P '^\tmake -C \S+\s*$' examples/Makefile | awk '{print $3}' | jq -R . | jq -sc .)
        echo "examples=$examples" >> $GITHUB_OUTPUT

  examples:
    needs: discover-examples
    name: example-${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover-examples.outputs.examples) }}
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space by removing preinstalled packages
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: cachix/cachix-action@v15
      with:
        name: hax
        skipPush: true
        extraPullNames: fstar-nix-versions, z3-nix-versions

    - name: Install the toolchain
      run: |
        nix profile install nixpkgs#yq
        nix profile install .#rustc
        nix profile install .

    - name: Install aeneas and charon
      run: ./install-aeneas.sh

    - name: Build example
      run: |
        cd examples
        PATH="$HOME/.cargo/bin:$PATH" nix develop ..#ci-examples --command make clean -C ${{ matrix.example }}
        PATH="$HOME/.cargo/bin:$PATH" nix develop ..#ci-examples --command make -C ${{ matrix.example }}
